<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shopee Video - Teste de Variantes</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  background:#0d0d0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  width:100%;
  max-width:560px;
  margin:20px auto;
}

.card{
  background:#17171b;
  border:1px solid #303036;
  border-radius:22px;
  padding:20px;
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

.sub{
  color:#aaa;
  line-height:1.5;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:16px;
  border-radius:13px;
  border:1px solid #36363d;
  background:#0d0d0f;
  color:#fff;
  font-size:15px;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:13px;
  background:#ee4d2d;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

#loading{
  display:none;
  text-align:center;
  margin-top:20px;
  color:#aaa;
}

#resultado{
  display:none;
  margin-top:22px;
}

.resumo{
  padding:14px;
  border-radius:13px;
  background:#11251b;
  border:1px solid #245d3c;
  color:#70e7a4;
  margin-bottom:18px;
  font-weight:bold;
}

.erro{
  padding:14px;
  border-radius:13px;
  background:#2a1215;
  border:1px solid #6b2930;
  color:#ff7a85;
}

.variante{
  background:#101013;
  border:1px solid #33333a;
  border-radius:17px;
  padding:15px;
  margin-top:16px;
}

.variante h2{
  font-size:18px;
  margin:0 0 6px;
}

.origem{
  color:#999;
  font-size:12px;
  margin-bottom:12px;
}

video{
  width:100%;
  max-height:620px;
  background:#000;
  border-radius:13px;
}

.baixar{
  display:block;
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:#ee4d2d;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font-weight:bold;
}

.url{
  margin-top:10px;
  color:#777;
  font-size:10px;
  word-break:break-all;
}

.diagnostico{
  margin-top:20px;
  padding:14px;
  background:#09090b;
  border:1px solid #29292f;
  border-radius:13px;
  font-size:12px;
  color:#aaa;
}

.diagnostico strong{
  color:#fff;
}

.novo{
  background:#29292f;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🧪 Shopee Video Variantes</h1>

<div class="sub">
Vamos verificar todas as versões de vídeo encontradas na página.
</div>

<input
  id="url"
  type="url"
  placeholder="https://br.shp.ee/..."
>

<button
  id="buscar"
  onclick="buscar()"
>
PROCURAR VARIANTES
</button>

<div id="loading">
🔎 Analisando página e procurando versões do vídeo...
</div>

<div id="resultado"></div>

</div>
</div>

<script>

const input =
  document.getElementById("url");

const buscarBtn =
  document.getElementById("buscar");

const loading =
  document.getElementById("loading");

const resultado =
  document.getElementById("resultado");


async function buscar(){

  const url =
    input.value.trim();

  if(!url){
    alert("Cole o link do Shopee Video.");
    return;
  }

  buscarBtn.disabled = true;
  loading.style.display = "block";
  resultado.style.display = "none";
  resultado.innerHTML = "";

  try{

    const response =
      await fetch(
        "/.netlify/functions/shopee-test",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            url
          })
        }
      );

    const data =
      await response.json();


    if(!data.ok){

      resultado.innerHTML = `
        <div class="erro">
          ❌ ${escapeHtml(
            data.error ||
            "Erro ao analisar vídeo."
          )}
        </div>
      `;

      return;
    }


    const variants =
      Array.isArray(data.variants)
        ? data.variants
        : [];


    resultado.innerHTML = `
      <div class="resumo">
        🔎 ${variants.length}
        variante(s) encontrada(s)
      </div>
    `;


    if(variants.length === 0){

      resultado.innerHTML += `
        <div class="erro">
          Nenhuma variante de mídia foi encontrada.
        </div>
      `;

    } else {

      variants.forEach(
        (item,index)=>{

          const mediaUrl =
            escapeAttr(item.url);

          const source =
            escapeHtml(
              item.source ||
              "desconhecida"
            );

          const type =
            escapeHtml(
              item.type ||
              "mídia"
            );


          resultado.innerHTML += `
            <div class="variante">

              <h2>
                🎬 Variante ${index + 1}
              </h2>

              <div class="origem">
                Tipo: ${type}
                • Origem: ${source}
              </div>

              ${
                item.type === "mp4"
                ?
                `
                <video
                  controls
                  playsinline
                  preload="metadata"
                  src="${mediaUrl}"
                ></video>
                `
                :
                `
                <div class="origem">
                  Esta variante não é um MP4 direto.
                </div>
                `
              }

              <a
                class="baixar"
                href="${mediaUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ⬇️ ABRIR VARIANTE ${index + 1}
              </a>

              <div class="url">
                ${escapeHtml(item.url)}
              </div>

            </div>
          `;
        }
      );
    }


    const diag =
      data.diagnostics || {};


    resultado.innerHTML += `
      <div class="diagnostico">

        <strong>🔬 Diagnóstico V3</strong>

        <br><br>

        Versão:
        ${escapeHtml(
          data.version || "-"
        )}

        <br>

        Variantes:
        ${escapeHtml(
          data.variant_count ??
          variants.length
        )}

        <br>

        NEXT_DATA:
        ${
          diag.next_data_found
            ? "✅ encontrado"
            : "❌ não encontrado"
        }

        <br>

        Scripts encontrados:
        ${escapeHtml(
          diag.total_scripts ?? "-"
        )}

        <br>

        Scripts analisados:
        ${escapeHtml(
          diag.inspected_scripts ?? "-"
        )}

        <br>

        MP4:
        ${
          data.mp4_found
            ? "✅"
            : "❌"
        }

        <br>

        M3U8:
        ${
          data.m3u8_found
            ? "✅"
            : "❌"
        }

      </div>

      <button
        class="novo"
        onclick="novo()"
      >
        TESTAR OUTRO LINK
      </button>
    `;

  }

  catch(error){

    resultado.innerHTML = `
      <div class="erro">
        ❌ Erro ao executar diagnóstico.
      </div>
    `;

  }

  finally{

    loading.style.display =
      "none";

    resultado.style.display =
      "block";

    buscarBtn.disabled =
      false;
  }
}


function novo(){

  input.value = "";

  resultado.innerHTML = "";

  resultado.style.display =
    "none";

  input.focus();
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}


function escapeAttr(value){

  return escapeHtml(value);
}

</script>

</body>
</html>
